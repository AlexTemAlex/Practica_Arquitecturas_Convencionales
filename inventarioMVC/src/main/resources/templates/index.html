<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>Inventario</title>
    </head>
    <body>

        <h1>Inventario</h1>
        <h2>Agregar Producto</h2>
        <form action="/add" method="post">
            <div>
                <input type="text" name="name" placeholder="Nombre" required>

            </div>
            <div>
                <input type="number" name="quantity" placeholder="Cantidad" required>

            </div>
            <div>
                <input type="number" step="0.01" name="price" placeholder="Precio" required>

            </div>
            <div>
                <input type="text" name="category" placeholder="Categoría">

            </div>
            <div>
                <input type="text" name="supplier" placeholder="Proveedor">

            </div>
            <button type="submit">Agregar</button>
        </form>

        <h2>Vender Producto</h2>
        <form action="/sell" method="post">
            <input type="number" name="index" placeholder="Índice">
            <input type="number" name="quantity" placeholder="Cantidad">
            <button type="submit">Vender</button>
        </form>

        <h2>Eliminar Producto</h2>
        <form action="/delete" method="post">
            <input type="number" name="index" placeholder="Índice">
            <button type="submit">Eliminar</button>
        </form>

        <h2>Resultadoss</h2>
        <p th:if="${error}" th:text="${error}" style="color:red"></p>
        <p th:if="${success}" th:text="${success}" style="color:green"></p>
        <h2>Lista de Productos</h2>
        <ul>
            <li th:each="p : ${products}" style="margin-bottom:4px; font-size:14px;">
                <span th:text="${p.name}"></span> -
                ID: <span th:text="${p.id}"></span> -
                Cant: <span th:text="${p.quantity}"></span> -
                $<span th:text="${p.price}"></span> -
                <span th:text="${p.category}"></span> -
                <span th:text="${p.supplier}"></span>
            </li>
        </ul>
    </body>
</html>
