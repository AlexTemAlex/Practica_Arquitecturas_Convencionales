<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>Inventario</title>
    </head>
    <body>

        <h1>Inventario</h1>

        <form action="/add" method="post">
            <div>
                <input type="text" name="name" placeholder="Nombre" required>

            </div>
            <div>
                <input type="number" name="quantity" placeholder="Cantidad" required>

            </div>
            <div>
                <input type="number" step="0.01" name="price" placeholder="Precio" required>

            </div>
            <div>
                <input type="text" name="category" placeholder="Categoría">

            </div>
            <div>
                <input type="text" name="supplier" placeholder="Proveedor">

            </div>
            <button type="submit">Agregar</button>
        </form>

        <ul>
            <li th:each="p : ${products}">
                <span th:text="${p.name}"></span> -
                <span th:text="${p.quantity}"></span> -
                <span th:text="${p.price}"></span>
                <span th:text="${p.category}"></span>
                <span th:text="${p.supplier}"></span>
            </li>
        </ul>

    </body>
</html>
